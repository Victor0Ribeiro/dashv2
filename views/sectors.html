<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setores · Radar de Talentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/public/css/app.css">
    <script type="module" src="/public/js/sectors.js"></script>
</head>
<body>
    <div class="app">
        <nav id="sidebar" class="sidebar" aria-label="Navegação principal"></nav>

        <main class="main">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Setores</h1>
                    <p class="page-subtitle"><span id="sector-count" aria-live="polite">Carregando…</span> · Cada setor tem um líder, avaliado também pela nota do time.</p>
                </div>
                <button type="button" class="btn btn-primary" id="new-sector" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    Novo setor
                </button>
            </header>

            <p class="alert alert-warning" id="unassigned" hidden></p>

            <div class="sector-grid section-gap" id="sector-grid">
                <div class="skeleton" aria-hidden="true"></div>
            </div>

            <section class="card empty" id="sector-empty" hidden>
                <p>Nenhum setor cadastrado ainda.</p>
                <p class="hint">Crie setores, atribua colaboradores a eles e escolha um líder para cada um.</p>
            </section>
        </main>
    </div>
</body>
</html>
