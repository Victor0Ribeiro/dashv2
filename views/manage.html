<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colaboradores · Radar de Talentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/public/css/app.css">
    <script type="module" src="/public/js/manage.js"></script>
</head>
<body>
    <div class="app">
        <nav id="sidebar" class="sidebar" aria-label="Navegação principal"></nav>

        <main class="main">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Colaboradores</h1>
                    <p class="page-subtitle">Cadastre pessoas e atribua notas de 0 a 10 para cada habilidade.</p>
                </div>
                <button type="button" class="btn btn-primary" id="new-employee" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    Novo colaborador
                </button>
            </header>

            <section class="card" aria-labelledby="table-title">
                <div class="card-header">
                    <div>
                        <h2 class="card-title" id="table-title">Equipe</h2>
                        <p class="card-description" id="employee-count" aria-live="polite">Carregando…</p>
                    </div>
                    <div class="filters-inline">
                        <label class="search">
                            <span class="sr-only">Buscar colaborador</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                            <input type="search" id="employee-search" class="input" placeholder="Buscar por nome ou crachá" autocomplete="off">
                        </label>
                        <label class="sr-only" for="sector-filter">Filtrar por setor</label>
                        <select class="input" id="sector-filter">
                            <option value="__todos__">Todos os setores</option>
                        </select>
                    </div>
                </div>
                <div class="table-wrap" id="employees-table-wrap">
                    <table class="table" id="employees-table">
                        <caption class="sr-only">Colaboradores cadastrados e suas notas</caption>
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <p class="empty" id="employees-empty" hidden></p>
            </section>
        </main>
    </div>

    <dialog class="modal" id="employee-dialog" aria-labelledby="employee-dialog-title">
        <form class="modal-form" id="employee-form" novalidate>
            <div class="modal-header">
                <h2 class="modal-title" id="employee-dialog-title">Novo colaborador</h2>
                <button type="button" class="icon-btn" id="employee-close" aria-label="Fechar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="field">
                    <label class="label" for="employee-name">Nome</label>
                    <input type="text" class="input" id="employee-name" maxlength="80" autocomplete="off" required>
                </div>
                <div class="filters">
                    <div class="field">
                        <label class="label" for="employee-badge">Crachá</label>
                        <input type="text" class="input" id="employee-badge" maxlength="20" autocomplete="off" aria-describedby="employee-badge-hint" required>
                        <span class="hint" id="employee-badge-hint">Identificador único (ex.: A-1024).</span>
                    </div>
                    <div class="field">
                        <label class="label" for="employee-sector">Setor</label>
                        <select class="input" id="employee-sector"></select>
                        <span class="hint">Gerencie setores e líderes em <a href="/setores">Setores</a>.</span>
                    </div>
                </div>
                <fieldset class="score-fields" id="employee-scores"></fieldset>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="employee-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="employee-submit">Cadastrar</button>
            </div>
        </form>
    </dialog>
</body>
</html>
